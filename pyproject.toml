[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup-prediction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "torch>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "matplotlib>=3.7",
    "soccerdata>=1.9",
    "pyarrow>=14.0",
    "requests>=2.31",
]

[project.scripts]
predict = "cli.predict:app"
backtest = "cli.backtest:app"
export = "cli.export:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "features*", "models*", "eval*", "cli*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ty.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "warn"

[tool.pytest.ini_options]
testpaths = ["tests"]
